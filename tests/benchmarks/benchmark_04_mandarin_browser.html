<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>普通话浏览器语音识别测试</title>
    <style>
        body {
            max-width: 980px;
            margin: 32px auto;
            padding: 0 24px;
            color: #172321;
            background: #f4f6f2;
            font: 18px/1.6 system-ui, sans-serif;
        }
        .panel {
            padding: 28px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 10px 35px rgba(34, 65, 59, .12);
        }
        label { display: block; margin: 14px 0 6px; font-weight: 700; }
        input, select, button {
            box-sizing: border-box;
            min-height: 48px;
            padding: 10px 14px;
            border: 2px solid #afbeb9;
            border-radius: 12px;
            font: inherit;
        }
        input { width: 100%; }
        button {
            margin: 20px 10px 0 0;
            border: 0;
            color: white;
            background: #356f65;
            font-weight: 700;
            cursor: pointer;
        }
        button.secondary { background: #3d64aa; }
        table { width: 100%; margin-top: 24px; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ccd6d2; text-align: left; }
        th { background: #e6f0ed; }
        .status { min-height: 32px; margin-top: 16px; font-weight: 700; }
    </style>
</head>
<body>
<main class="panel">
    <h1>普通话浏览器语音识别测试</h1>
    <p>
        本工具测量 Web Speech API 从开始监听到最终文本返回的时间，并计算字符错误率。
        请使用 Edge 或 Chrome，通过 localhost 打开，不要填写参与者姓名。
    </p>

    <label for="sample-id">匿名样本编号</label>
    <input id="sample-id" placeholder="例如：M-Q-001">

    <label for="environment">环境</label>
    <select id="environment">
        <option value="quiet">安静环境</option>
        <option value="noise">一般生活噪声</option>
    </select>

    <label for="reference">人工校对的标准文本</label>
    <input id="reference" placeholder="例如：今天星期三">

    <button id="start">开始识别</button>
    <button id="download" class="secondary">下载CSV</button>
    <div class="status" id="status" aria-live="polite"></div>

    <table>
        <thead>
            <tr>
                <th>样本</th><th>环境</th><th>识别文本</th>
                <th>时延(s)</th><th>CER</th>
            </tr>
        </thead>
        <tbody id="results"></tbody>
    </table>
</main>

<script>
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const rows = [];
const statusNode = document.getElementById('status');

function normalizeText(value) {
    return String(value || '')
        .trim()
        .toLowerCase()
        .replace(/[\s，。！？、,.!?；;：:（）()"“”‘’'\-]/g, '');
}

function editDistance(reference, prediction) {
    const a = Array.from(normalizeText(reference));
    const b = Array.from(normalizeText(prediction));
    let previous = Array.from({length: b.length + 1}, (_, index) => index);
    for (let row = 1; row <= a.length; row += 1) {
        const current = [row];
        for (let column = 1; column <= b.length; column += 1) {
            current.push(Math.min(
                current[column - 1] + 1,
                previous[column] + 1,
                previous[column - 1] + (a[row - 1] === b[column - 1] ? 0 : 1)
            ));
        }
        previous = current;
    }
    return previous[b.length];
}

function csvEscape(value) {
    return `"${String(value ?? '').replaceAll('"', '""')}"`;
}

document.getElementById('start').addEventListener('click', () => {
    if (!Recognition) {
        statusNode.textContent = '当前浏览器不支持 Web Speech API。';
        return;
    }
    const sampleId = document.getElementById('sample-id').value.trim();
    const environment = document.getElementById('environment').value;
    const reference = document.getElementById('reference').value.trim();
    if (!sampleId || !reference) {
        statusNode.textContent = '请先填写匿名样本编号和标准文本。';
        return;
    }

    const recognition = new Recognition();
    recognition.lang = 'zh-CN';
    recognition.interimResults = false;
    recognition.continuous = false;
    const started = performance.now();
    statusNode.textContent = '正在听，请完整说出标准文本……';

    recognition.onresult = event => {
        const prediction = event.results[0][0].transcript;
        const latency = (performance.now() - started) / 1000;
        const normalizedReference = normalizeText(reference);
        const cer = normalizedReference
            ? editDistance(reference, prediction) / Array.from(normalizedReference).length
            : null;
        const row = {
            timestamp: new Date().toISOString(),
            sample_id: sampleId,
            language: 'mandarin',
            environment,
            reference,
            prediction,
            success: 1,
            latency_s: latency.toFixed(6),
            cer: cer.toFixed(6),
            error: ''
        };
        rows.push(row);
        document.getElementById('results').insertAdjacentHTML(
            'beforeend',
            `<tr><td>${sampleId}</td><td>${environment}</td>` +
            `<td>${prediction}</td><td>${row.latency_s}</td>` +
            `<td>${row.cer}</td></tr>`
        );
        statusNode.textContent = '本条记录完成，可以继续下一条。';
    };
    recognition.onerror = event => {
        rows.push({
            timestamp: new Date().toISOString(),
            sample_id: sampleId,
            language: 'mandarin',
            environment,
            reference,
            prediction: '',
            success: 0,
            latency_s: ((performance.now() - started) / 1000).toFixed(6),
            cer: '',
            error: event.error
        });
        statusNode.textContent = `识别失败：${event.error}`;
    };
    recognition.start();
});

document.getElementById('download').addEventListener('click', () => {
    if (!rows.length) {
        statusNode.textContent = '当前还没有测试记录。';
        return;
    }
    const fields = [
        'timestamp', 'sample_id', 'language', 'environment',
        'reference', 'prediction', 'success', 'latency_s', 'cer', 'error'
    ];
    const csv = [
        fields.join(','),
        ...rows.map(row => fields.map(field => csvEscape(row[field])).join(','))
    ].join('\r\n');
    const link = document.createElement('a');
    link.href = URL.createObjectURL(
        new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8'})
    );
    link.download = 'asr_mandarin_results.csv';
    link.click();
    URL.revokeObjectURL(link.href);
});
</script>
</body>
</html>
