name: 功能建议
description: 提议一个有明确使用场景的新功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 谁会在什么情况下使用这个功能？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 该功能不会把研究结果表述为医疗诊断
          required: true
        - label: 该功能不要求提交真实密钥或个人敏感数据
          required: true
