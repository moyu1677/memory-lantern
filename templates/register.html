{% extends "base.html" %}
{% block title %}注册账号 · 忆路明灯{% endblock %}
{% block shell_class %}narrow-shell{% endblock %}

{% block content %}
<section class="auth-card" aria-labelledby="register-title">
    <div class="auth-intro">
        <div class="auth-icon" aria-hidden="true">📝</div>
        <h1 id="register-title">注册新账号</h1>
        <p>先选择您的使用身份，再填写账号信息。账号名称不能与他人重复。</p>
    </div>

    <form class="form-grid" method="post" autocomplete="on">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

        <fieldset class="role-picker">
            <legend>请选择账户类型</legend>
            <label class="role-choice role-choice-elder">
                <input type="radio" name="account_type" value="elder"
                    {% if request.form.get('account_type', 'elder') == 'elder' %}checked{% endif %}>
                <span class="role-choice-icon" aria-hidden="true">👴</span>
                <strong>老人端</strong>
                <small>进行测试、查看自己的结果与绑定码</small>
            </label>
            <label class="role-choice role-choice-family">
                <input type="radio" name="account_type" value="family"
                    {% if request.form.get('account_type') == 'family' %}checked{% endif %}>
                <span class="role-choice-icon" aria-hidden="true">💙</span>
                <strong>家属端</strong>
                <small>绑定老人、查看结果并与社区留言</small>
            </label>
            <label class="role-choice role-choice-community">
                <input type="radio" name="account_type" value="community"
                    {% if request.form.get('account_type') == 'community' %}checked{% endif %}>
                <span class="role-choice-icon" aria-hidden="true">🧡</span>
                <strong>社区端</strong>
                <small>服务老人、查看结果并与家属留言</small>
            </label>
        </fieldset>

        <div class="field">
            <label for="username">账号名称</label>
            <input
                id="username"
                name="username"
                type="text"
                minlength="3"
                maxlength="24"
                autocomplete="username"
                required
                autofocus
                value="{{ request.form.get('username', '') }}"
                placeholder="例如：zhangyeye"
            >
            <span class="field-help">3至24位，可使用中文、英文字母、数字和下划线，不能重复。</span>
        </div>

        <div class="field">
            <label for="display_name">希望我们怎么称呼您</label>
            <input
                id="display_name"
                name="display_name"
                type="text"
                maxlength="30"
                autocomplete="name"
                value="{{ request.form.get('display_name', '') }}"
                placeholder="例如：张爷爷、女儿小张或幸福社区"
            >
        </div>

        <div class="field">
            <label for="password">设置密码</label>
            <input
                id="password"
                name="password"
                type="password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                required
                placeholder="请输入至少8位密码"
            >
            <span class="field-help">密码至少8位，并且同时包含英文字母和数字。</span>
        </div>

        <div class="field">
            <label for="password_confirm">再次输入密码</label>
            <input
                id="password_confirm"
                name="password_confirm"
                type="password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                required
                placeholder="请再次输入相同的密码"
            >
        </div>

        <button class="button-wide" type="submit">确认注册</button>
    </form>

    <p class="auth-footer">
        已经有账号？
        <a class="text-link" href="{{ url_for('login') }}">返回登录</a>
    </p>
</section>
{% endblock %}
