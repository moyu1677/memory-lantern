{% extends "base.html" %}
{% block title %}重置密码 · 忆路明灯{% endblock %}
{% block shell_class %}narrow-shell{% endblock %}

{% block content %}
<div class="back-row">
    <a class="text-link" href="{{ url_for('admin_users') }}">← 返回用户管理</a>
</div>

<section class="auth-card">
    <div class="auth-intro">
        <div class="auth-icon" aria-hidden="true">🔑</div>
        <h1>重置用户密码</h1>
        <p>正在为“{{ user['display_name'] }}”（账号：{{ user['username'] }}）设置新密码。</p>
    </div>

    <form class="form-grid" method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

        <div class="field">
            <label for="password">新密码</label>
            <input id="password" name="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password">
            <span class="field-help">至少8位，并同时包含英文字母和数字。</span>
        </div>

        <div class="field">
            <label for="password_confirm">再次输入新密码</label>
            <input id="password_confirm" name="password_confirm" type="password" minlength="8" maxlength="128" required autocomplete="new-password">
        </div>

        <button class="button-wide" type="submit">确认重置密码</button>
    </form>
</section>
{% endblock %}
