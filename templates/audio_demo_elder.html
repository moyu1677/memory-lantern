<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>语音陪聊 · 忆路明灯</title><style>body{max-width:800px;margin:32px auto;padding:0 20px;font:20px/1.65 "Microsoft YaHei",sans-serif;color:#064b4a;background:#f7f5ef}main{padding:28px;border:2px solid #a7d2c8;border-radius:20px;background:#fff}textarea,select,button{font:inherit}textarea,select{width:100%;margin:8px 0;padding:12px;border:1px solid #a7d2c8;border-radius:10px}button{margin:8px 6px 8px 0;padding:12px 18px;border:0;border-radius:10px;background:#15766f;color:#fff}#reply{white-space:pre-wrap;padding:18px;background:#eaf5f1;border-radius:12px}.muted{color:#5d7573}</style></head>
<body><main><p>老人端 · 语音陪聊</p><h1>慢慢说，我在听</h1><p>{% if voice_profile_label %}已连接家人声音：{{ voice_profile_label }}{% else %}还没有连接家人声音，也可以先文字聊天。{% endif %}</p><label for="voice-language">语音类型</label><select id="voice-language"><option value="browser">普通话</option><option value="cantonese">粤语</option><option value="chaoshan">潮汕话</option></select><textarea id="message" rows="4" placeholder="可以直接输入，也可以录音后自动转写。"></textarea><p><button id="send">发送</button><button id="record">开始语音陪聊</button><input id="upload" type="file" accept="audio/*"></p><p class="muted" id="status"></p><div id="reply" aria-live="polite">您想聊什么都可以。</div><audio id="player" controls hidden></audio></main><script>
const csrf=document.querySelector('meta[name="csrf-token"]').content, message=document.getElementById('message'),status=document.getElementById('status'),reply=document.getElementById('reply'),player=document.getElementById('player');let recorder,stream,chunks=[];
async function send(){const text=message.value.trim();if(!text)return;status.textContent='正在回复…';const r=await fetch('/audio/chat',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({message:text})});const p=await r.json();if(!r.ok)throw new Error(p.error);reply.textContent=p.reply;status.textContent='回复已准备好。';if(p.voice_reply_token){const a=await fetch('/audio/synthesize',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({reply_token:p.voice_reply_token})});if(a.ok){player.src=URL.createObjectURL(await a.blob());player.hidden=false;player.play().catch(()=>{})}}}
async function recognize(file){status.textContent='正在识别…';const data=new FormData();data.set('audio',file);data.set('language',document.getElementById('voice-language').value);const r=await fetch('/audio/recognize',{method:'POST',headers:{'X-CSRF-Token':csrf},body:data});const p=await r.json();if(!r.ok)throw new Error(p.error);message.value=p.text;await send()}
document.getElementById('send').onclick=()=>send().catch(e=>status.textContent=e.message);document.getElementById('upload').onchange=e=>e.target.files[0]&&recognize(e.target.files[0]).catch(x=>status.textContent=x.message);document.getElementById('record').onclick=async()=>{try{if(recorder?.state==='recording'){recorder.stop();return}stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());recognize(new File([new Blob(chunks,{type:recorder.mimeType})],'elder-turn.webm',{type:recorder.mimeType})).catch(x=>status.textContent=x.message)};recorder.start();status.textContent='正在录音，再次点击“开始语音陪聊”结束。'}catch(e){status.textContent='无法使用麦克风，请改为上传录音。'}};
</script></body></html>
